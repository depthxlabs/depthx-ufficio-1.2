# Adrian, prova dei portali con Chrome dalle macchine di GitHub (una visita per portale)
name: Ricerca 01 Adrian prova dei portali
on: { workflow_dispatch: {} }
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_02_ProvaDeiPortaliConChrome.py"
