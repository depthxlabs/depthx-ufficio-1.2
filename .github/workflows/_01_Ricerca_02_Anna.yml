# Anna, Ricerca agenzie immobiliari da Maps (Ufficio 1.2 Planimetrie 3D, area Ricerca)
name: Ricerca 02 Anna agenzie da Maps
on:
  workflow_dispatch:
    inputs:
      citta: { description: "Città da cercare", required: true, default: "Brescia" }
      provincia: { description: "Sigla della provincia", required: true, default: "BS" }
      quota: { description: "Righe da scrivere", required: true, default: "10" }
concurrency: { group: anna, cancel-in-progress: false }
jobs:
  anna:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth
      - name: Anna al lavoro
        env:
          CHIAVE_GOOGLE_MAPS: ${{ secrets.CHIAVE_GOOGLE_MAPS }}
          CHIAVE_GOOGLE_SHEET: ${{ secrets.CHIAVE_GOOGLE_SHEET }}
          PYTHONIOENCODING: utf-8
        run: python -I "_01_Ricerca/_02_Anna_AgenzieDaMaps/_01_AnnaRicercaAgenzieDaMaps.py" --citta "${{ inputs.citta }}" --provincia "${{ inputs.provincia }}" --quota "${{ inputs.quota }}"
