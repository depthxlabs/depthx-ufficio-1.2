# Brian, Ricerca agenti immobiliari singoli (Ufficio 1.2 Planimetrie 3D, area Ricerca, capo area Adrian)
name: Ricerca 04 Brian agenti immobiliari singoli
on:
  workflow_dispatch:
    inputs:
      citta: { description: "Città da cercare", required: true, default: "Brescia" }
      provincia: { description: "Sigla della provincia", required: true, default: "BS" }
      quota: { description: "Righe da scrivere", required: true, default: "10" }
concurrency: { group: ricerca-brian, cancel-in-progress: false }
permissions:
  contents: read
  checks: write
env:
  GH_TOKEN: ${{ github.token }}
jobs:
  ricerca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-dati-1.2, ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}", path: dati, sparse-checkout: _01_ListaCRM }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Brian al lavoro su Google Maps
        env:
          CHIAVE_GOOGLE_MAPS: ${{ secrets.CHIAVE_GOOGLE_MAPS }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Rome
        run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_01_MotoreDellaRicercaSuMaps.py" --dipendente Brian --citta "${{ inputs.citta }}" --provincia "${{ inputs.provincia }}" --quota "${{ inputs.quota }}"
      - name: Brian al lavoro su Instagram (profili pubblici tramite Brave)
        if: always()
        env:
          CHIAVE_BRAVE_SEARCH: ${{ secrets.CHIAVE_BRAVE_SEARCH }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Rome
        run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_03_MotoreDellaRicercaSuBrave.py" --dipendente Brian --citta "${{ inputs.citta }}" --provincia "${{ inputs.provincia }}" --quota "${{ inputs.quota }}"
