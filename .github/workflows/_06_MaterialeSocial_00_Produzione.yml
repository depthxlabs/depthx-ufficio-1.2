# Ufficio Materiale social (Ufficio 1.2 Planimetrie 3D, responsabile Freya): produzione dei video per i social.
# Due schede Vast nello stesso momento: Nadia produce FloorView, Isla produce Unfold.
# Ogni scheda: noleggio con la regola dei 5 minuti, libreria da Drive, provino, render con anti tremolio a 0,00%,
# scaricamento, distruzione sempre. Poi il formato post Instagram dal verticale e il salvataggio su Drive per formato.
name: Materiale social 00 Produzione (Freya)
on:
  workflow_dispatch:
    inputs:
      versione:
        description: "Versione da produrre (1, 2 o 3)"
        default: "1"
concurrency: materiale-social
jobs:
  produzione:
    name: ${{ matrix.chi }} ${{ matrix.nome }} versione ${{ inputs.versione }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - { chi: Nadia, prodotto: _01_FloorView, nome: FloorView, sigla: fv }
          - { chi: Isla, prodotto: _02_Unfold, nome: Unfold, sigla: uf }
    env:
      VERSIONE: ${{ inputs.versione }}
      PRODOTTO: ${{ matrix.prodotto }}
      NOME: ${{ matrix.nome }}
      SIGLA: ${{ matrix.sigla }}
      LIBRERIA_DRIVE: 1GCGqFKfkGjIx5DwTdoR3WSjzqInUSovB
      USCITA_DRIVE: 1LTHpyPu8mC1g5AQrWtQWKCj8V9pTFLpZ
      FLAG_CHROME: "--use-angle=gl-egl --use-gl=angle --enable-gpu"
    steps:
      - uses: actions/checkout@v4

      - name: Strumenti e chiavi
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          SSH_PRIVATA_VAST: ${{ secrets.SSH_PRIVATA_VAST }}
        run: |
          pip install -q vastai
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p ~/.config/rclone ~/.ssh
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          printf '%s\n' "$SSH_PRIVATA_VAST" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          vastai set api-key "$VAST_API_KEY" > /dev/null
          echo "CREDITO_PRIMA=$(vastai show user --raw | python3 -c 'import json,sys; print(json.load(sys.stdin)["credit"])')" >> $GITHUB_ENV

      - name: Pacco e coda
        run: |
          mkdir -p lavoro
          cp -r _06_MaterialeSocial/_01_MotoreProduzione lavoro/_00_Motore
          cp -r "_06_MaterialeSocial/_02_Case/$PRODOTTO" lavoro/
          for d in lavoro/$PRODOTTO/*/; do
            c=$(basename "$d")
            for f in orizzontale verticale; do
              o=${f:0:1}
              echo "${SIGLA}${c:1:2}${o}|$PRODOTTO/$c/codice/index.html?o=$o|$f|$PRODOTTO/$c/DepthX_${NOME}${VERSIONE}${c}_${f}_60fps.mp4"
            done
          done > coda_tutta.txt
          cat coda_tutta.txt
          tar -C lavoro -czf pacco.tgz _00_Motore "$PRODOTTO"

      - name: Noleggio, regola dei 5 minuti
        id: scheda
        run: |
          for prova in 1 2 3; do
            ID=$(vastai search offers 'gpu_name=RTX_4090 num_gpus=1 reliability>0.98 cpu_cores_effective>=16 inet_down>300 disk_space>=60 direct_port_count>=1 rentable=true' -o 'dph+' --raw | python3 -c "import json,sys; o=json.load(sys.stdin); print(o[$prova-1]['id'] if len(o)>=$prova else '')")
            [ -z "$ID" ] && continue
            I=$(vastai create instance "$ID" --image nvidia/cuda:12.4.1-runtime-ubuntu22.04 --env '-e NVIDIA_DRIVER_CAPABILITIES=all' --disk 60 --ssh --direct --raw | python3 -c 'import json,sys; print(json.load(sys.stdin)["new_contract"])')
            echo "istanza=$I" >> $GITHUB_OUTPUT
            echo "ISTANZA=$I" >> $GITHUB_ENV
            for t in $(seq 1 30); do
              sleep 10
              U=$(vastai ssh-url "$I" 2>/dev/null || true)
              [ -z "$U" ] && continue
              A=${U#ssh://}; H=${A%:*}; P=${A##*:}
              if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=8 -p "$P" "$H" true 2>/dev/null; then
                echo "SSH_HOST=$H" >> $GITHUB_ENV; echo "SSH_PORTA=$P" >> $GITHUB_ENV
                echo "Scheda $I pronta dopo $((t*10)) secondi"; exit 0
              fi
            done
            echo "Scheda $I non pronta in 5 minuti: distrutta"
            vastai destroy instance "$I" -y
          done
          echo "NOTGO: nessuna scheda pronta in 3 tentativi"; exit 1

      - name: Lavoro sulla scheda
        run: |
          S="ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -p $SSH_PORTA $SSH_HOST"
          scp -o StrictHostKeyChecking=no -P "$SSH_PORTA" pacco.tgz coda_tutta.txt ~/.config/rclone/rclone.conf "$SSH_HOST:/root/"
          $S "set -e; mkdir -p /root/lavoro; tar -xzf /root/pacco.tgz -C /root/lavoro
            curl -fsSL https://rclone.org/install.sh | bash > /dev/null
            rclone --config /root/rclone.conf copy gdrive:_02_Librerie3D /root/lavoro/_00_Motore/assets/libreria --drive-root-folder-id $LIBRERIA_DRIVE --transfers 16
            rm -f /root/rclone.conf
            cd /root/lavoro/_00_Motore/strumenti && bash vast_prepara.sh"
          $S "cd /root/lavoro/_00_Motore/strumenti; export FLAG_CHROME='$FLAG_CHROME'; : > coda_vast.txt
            while IFS='|' read -r id pagina modo video; do
              [ \"\$modo\" = orizzontale ] || { grep -q \"^\${id%?}o|\" ok.txt 2>/dev/null && echo \"\$id|\$pagina|\$modo|\$video\" >> coda_vast.txt; continue; }
              r=\$(timeout 300 node provino.js /root/lavoro \"\$pagina\" /root/provini/\$id 2,6,10 orizzontale 2>&1 | grep -E 'arredo|ERRORE' | tail -1)
              echo \"provino \$id: \$r\"
              echo \"\$r\" | grep -q 'arredo 0 problemi | camera 0 problemi' && { echo \"\$id|\$pagina|\$modo|\$video\" >> ok.txt; echo \"\$id|\$pagina|\$modo|\$video\" >> coda_vast.txt; }
            done < /root/coda_tutta.txt
            echo 'In coda:'; cat coda_vast.txt
            [ -s coda_vast.txt ] && timeout 5400 node vast_rendi.js /root/lavoro coda_vast.txt 12 400 || echo 'NOTGO: nessuna casa ha passato il provino'"
          mkdir -p uscita
          scp -o StrictHostKeyChecking=no -P "$SSH_PORTA" "$SSH_HOST:/root/lavoro/$PRODOTTO/*/*.mp4" uscita/ || echo "nessun video scaricato"
          scp -o StrictHostKeyChecking=no -P "$SSH_PORTA" "$SSH_HOST:/root/lavoro/_00_Motore/strumenti/vast_rendi.log" uscita/ || true
          ls -la uscita

      - name: Distruzione della scheda, sempre
        if: always() && env.ISTANZA != ''
        run: |
          vastai destroy instance "$ISTANZA" -y || true
          sleep 15
          vastai show instances --raw | python3 -c "import json,sys,os; a=[x for x in json.load(sys.stdin) if str(x['id'])==os.environ['ISTANZA']]; print('Macchine accese:', len(a))"

      - name: Post Instagram e salvataggio su Drive
        if: always()
        run: |
          mkdir -p drive/_01_VideoVerticali drive/_02_VideoOrizzontali drive/_03_VideoFormatoPostInstagram
          for v in uscita/*_verticale_60fps.mp4; do
            [ -e "$v" ] || continue
            cp "$v" drive/_01_VideoVerticali/
            ffmpeg -v error -y -i "$v" -vf "crop=1080:1350:0:285" -c:v libx264 -crf 17 -preset slow -an "drive/_03_VideoFormatoPostInstagram/$(basename "${v/_verticale_/_postinstagram_}")"
          done
          for v in uscita/*_orizzontale_60fps.mp4; do [ -e "$v" ] && cp "$v" drive/_02_VideoOrizzontali/; done
          rclone copy drive "gdrive:" --drive-root-folder-id "$USCITA_DRIVE" --ignore-existing
          CREDITO_DOPO=$(vastai show user --raw | python3 -c 'import json,sys; print(json.load(sys.stdin)["credit"])')
          N=$(find drive -name '*.mp4' | wc -l)
          echo "## $NOME versione $VERSIONE" >> $GITHUB_STEP_SUMMARY
          echo "Video salvati su Drive: $N su 18. Spesa: $(python3 -c "print(round($CREDITO_PRIMA-$CREDITO_DOPO,3))") $" >> $GITHUB_STEP_SUMMARY
