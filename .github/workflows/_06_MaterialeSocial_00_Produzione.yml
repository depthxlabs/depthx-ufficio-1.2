# Ufficio Materiale social (Ufficio 1.2 Planimetrie 3D, responsabile Freya): produce soltanto i video, versione parallela.
# Si accende e si spegne dal pannello di Hector.
# 1. Preparazione: un pacco con motore, case e solo la libreria usata; la coda di tutti i video.
# 2. Provini su GitHub, in parallelo, con il provino veloce (solo controlli di arredo e camera, senza scheda grafica).
# 3. Parti: i video promossi divisi in parti uguali per fotogrammi, una scheda per parte.
# 4. Render: ogni parte noleggia 2 schede insieme, tiene la prima pronta e distrugge l'altra; immagine pronta, nessuna installazione.
#    Ogni scheda ha l'etichetta ms|giro|parte: il Centro Gestione la legge di secondo in secondo.
# 5. Chiusura: video su GitHub per formato (il disco li legge in _03_DatabaseMediaProdotti), stato di ogni video, spesa, 0 schede accese.
name: Materiale social 00 Produzione (Freya)
on:
  workflow_dispatch:
    inputs:
      versioni:
        description: "Versioni da produrre, separate da spazi"
        default: "1 2 3"
      schede:
        description: "Schede in parallelo"
        default: "4"
      solo:
        description: "Solo questi video, separati da spazi (vuoto: tutti)"
        default: ""
concurrency: materiale-social
permissions:
  contents: read
  checks: write
  packages: read
env:
  GH_TOKEN: ${{ github.token }}
  VERSIONE: ${{ inputs.versioni || '1 2 3' }}
  SCHEDE: ${{ inputs.schede || '4' }}
  SOLO: ${{ inputs.solo }}
  SOGLIA_GLITCH: "0.0000999"
  TETTO_SPESA: "1.5"
  IMMAGINE: ghcr.io/depthxlabs/depthx-scheda-render:latest
  FLAG_CHROME: "--use-angle=gl-egl --use-gl=angle --enable-gpu"
  PAESI: "AT BE BG CH CZ DE DK EE ES FI FR GB GR HR HU IE IS IT LT LU LV NL NO PL PT RO SE SI SK"
jobs:
  prepara:
    name: Preparazione del pacco e della coda
    runs-on: ubuntu-latest
    outputs:
      gruppi: ${{ steps.coda.outputs.gruppi }}
      credito: ${{ steps.coda.outputs.credito }}
    steps:
      - uses: actions/checkout@v4
      - name: Libreria 3D dal repository privato depthx-libreria-3d-1.2
        uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-libreria-3d-1.2, ssh-key: "${{ secrets.CHIAVE_LIBRERIA_SOCIALE }}", path: libreria }
      - id: coda
        name: Pacco, coda e controlli dei produttori
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          pip install -q vastai && vastai set api-key "$VAST_API_KEY" > /dev/null
          echo "credito=$(vastai show user --raw | python3 -c 'import json,sys; print(json.load(sys.stdin)["credit"])')" >> $GITHUB_OUTPUT
          mkdir -p lavoro && cp -r _06_MaterialeSocial/_01_MotoreProduzione lavoro/_00_Motore
          cp -r _06_MaterialeSocial/_02_Case/_01_FloorView _06_MaterialeSocial/_02_Case/_02_Unfold lavoro/
          python3 - <<'PY'
          import re, json, os
          t = open("lavoro/_00_Motore/motore/libreria.js", encoding="utf-8").read()
          mod = re.search(r"MODELLI = \{(.*?)\n\};", t, re.S).group(1); mat = re.search(r"MATERIALI = \{(.*?)\n\};", t, re.S).group(1)
          righe = sorted({f"+ modelli/{m}/**" for m in re.findall(r"\['([A-Za-z0-9_]+)', -?\d+\]", mod)})
          righe += sorted({f"+ materiali/{m}/{m}_1K-JPG_*.jpg" for m in re.findall(r"\['([A-Za-z0-9_]+)', [\d.]+\]", mat)})
          open("filtro_libreria.txt", "w").write("\n".join(righe + ["- **"]) + "\n")
          PRODOTTI = [("Nadia", "_01_FloorView", "FloorView", "fv"), ("Isla", "_02_Unfold", "Unfold", "uf")]
          coda, orizz = [], []
          for ver in os.environ["VERSIONE"].split():
              for chi, prod, nome, sigla in PRODOTTI:
                  for c in sorted(os.listdir(f"lavoro/{prod}")):
                      for f in ("orizzontale", "verticale", "post"):
                          i = f"{sigla}{c[1:3]}{ver}{f[0]}"
                          coda.append(f"{i}|{prod}/{c}/codice/index.html?o={f[0]}&ver={ver}|{f}|{prod}/{c}/DepthX_{nome}{ver}{c}_{f}_60fps.mp4|{chi}")
                          if f == "orizzontale": orizz.append(i)
          solo = set(os.environ.get("SOLO", "").split())
          if solo:
              coda = [r for r in coda if r.split("|")[0] in solo]
              orizz = sorted({r.split("|")[0][:-1] + "o" for r in coda})
          open("coda_tutta.txt", "w").write("\n".join(coda) + "\n")
          gruppi = [orizz[k::12] for k in range(12)]
          for k, g in enumerate(gruppi): open(f"gruppo_{k+1:02d}.txt", "w").write("\n".join(g) + "\n")
          open(os.environ["GITHUB_OUTPUT"], "a").write("gruppi=" + json.dumps([k + 1 for k, g in enumerate(gruppi) if g]) + "\n")
          for chi, prod, nome, sigla in PRODOTTI:
              av = {"chi": chi, "prodotto": nome, "versione": os.environ["VERSIONE"], "fase": "Provini su GitHub", "schede_previste": int(os.environ["SCHEDE"]),
                    "video": {r.split("|")[0]: "in_coda" for r in coda if r.endswith("|" + chi)}, "salvati": 0, "parallelo": True}
              json.dump(av, open(f"av_{chi}.json", "w"))
          print(len(coda), "video in coda,", len(orizz), "provini")
          PY
          mkdir -p lavoro/_00_Motore/assets/libreria
          rsync -am --include="*/" --filter="merge filtro_libreria.txt" libreria/ lavoro/_00_Motore/assets/libreria/
          echo "libreria nel pacco: $(du -sh lavoro/_00_Motore/assets/libreria | cut -f1)"
          tar -C lavoro -czf pacco.tgz _00_Motore _01_FloorView _02_Unfold
          for chi in Nadia Isla; do
            gh api -X POST "repos/$GITHUB_REPOSITORY/check-runs" -f name="Materiale social $chi" -f head_sha="$GITHUB_SHA" -f status=in_progress -f external_id="$GITHUB_RUN_ID" \
              -f "output[title]=Provini su GitHub" -f "output[summary]=$(cat av_$chi.json)" --jq .id > cid_$chi.txt
          done
      - uses: actions/upload-artifact@v4
        with: { name: pacco, path: "pacco.tgz\ncoda_tutta.txt\ngruppo_*.txt\nav_*.json\ncid_*.txt", retention-days: 1 }

  provini:
    name: Provini ${{ matrix.gruppo }}
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        gruppo: ${{ fromJSON(needs.prepara.outputs.gruppi) }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: pacco }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Provino veloce di ogni casa e versione
        run: |
          G=$(printf '%02d' ${{ matrix.gruppo }})
          mkdir -p lavoro && tar -xzf pacco.tgz -C lavoro
          (cd lavoro/_00_Motore/strumenti && npm i --silent --no-audit --no-fund puppeteer-core@25.17.0 > /dev/null)
          : > esito_$G.txt
          for id in $(cat gruppo_$G.txt); do
            (
              pagina=$(grep "^$id|" coda_tutta.txt | cut -d'|' -f2)
              r=$(cd lavoro/_00_Motore/strumenti && CHROME=/usr/bin/google-chrome FLAG_CHROME="--use-angle=swiftshader --enable-unsafe-swiftshader" timeout 900 node provino_controlli.js "$GITHUB_WORKSPACE/lavoro" "$pagina" orizzontale 2>&1 | grep -E "problemi|ERRORE" | head -1)
              echo "$id|$r" >> esito_$G.txt; echo "$id: $r"
            ) &
          done
          wait
      - uses: actions/upload-artifact@v4
        with: { name: "provini-${{ matrix.gruppo }}", path: "esito_*.txt", retention-days: 1 }

  parti:
    name: Divisione in parti
    needs: [prepara, provini]
    if: always() && needs.prepara.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      parti: ${{ steps.dividi.outputs.parti }}
    steps:
      - uses: actions/download-artifact@v4
        with: { path: arrivi }
      - id: dividi
        name: Video promossi divisi per fotogrammi
        run: |
          cp arrivi/pacco/* .
          cat arrivi/provini-*/esito_*.txt > esiti.txt 2>/dev/null || : > esiti.txt
          python3 - <<'PY'
          import json, os, subprocess
          esiti = {l.split("|", 1)[0]: l.split("|", 1)[1].strip() for l in open("esiti.txt", encoding="utf-8") if "|" in l}
          coda = [l.strip() for l in open("coda_tutta.txt", encoding="utf-8") if l.strip()]
          ok, av = [], {c: json.load(open(f"av_{c}.json")) for c in ("Nadia", "Isla")}
          for r in coda:
              i, chi = r.split("|")[0], r.split("|")[4]
              e = esiti.get(i[:-1] + "o", "provino non fatto")
              if "arredo 0 problemi | camera 0 problemi" in e: ok.append(r); av[chi]["video"][i] = "provino_ok"
              else: av[chi]["video"][i] = "NOTGO_provino: " + e[:120]
          N = max(1, min(int(os.environ["SCHEDE"]), len(ok)))
          stima = lambda r: 2750 if r.startswith("uf") else 1500
          parti = [[] for _ in range(N)]
          for r in sorted(ok, key=stima, reverse=True): min(parti, key=lambda p: sum(map(stima, p))).append(r)
          for k, p in enumerate(parti): open(f"parte_{k+1:02d}.txt", "w").write("\n".join("|".join(x.split("|")[:4]) for x in p) + "\n")
          open(os.environ["GITHUB_OUTPUT"], "a").write("parti=" + json.dumps([k + 1 for k in range(N) if parti[k]]) + "\n")
          for c in av:
              av[c]["fase"] = f"Render su {N} schede"; json.dump(av[c], open(f"av_{c}.json", "w"))
              cid = open(f"cid_{c}.txt").read().strip()
              subprocess.run(["gh", "api", "-X", "PATCH", f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs/{cid}", "--input", "-"],
                             input=json.dumps({"output": {"title": av[c]["fase"], "summary": json.dumps(av[c], ensure_ascii=False)}}).encode(), capture_output=True)
          print(len(ok), "video promossi su", len(coda), "in", N, "parti")
          PY
      - uses: actions/upload-artifact@v4
        with: { name: parti, path: "parte_*.txt\nav_*.json\ncid_*.txt", retention-days: 1 }

  render:
    name: Scheda ${{ matrix.parte }}
    needs: [prepara, parti]
    if: always() && needs.parti.result == 'success' && needs.parti.outputs.parti != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        parte: ${{ fromJSON(needs.parti.outputs.parti) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pacco }
      - uses: actions/download-artifact@v4
        with: { name: parti }
      - name: Chiavi
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
          SSH_PRIVATA_VAST: ${{ secrets.SSH_PRIVATA_VAST }}
        run: |
          pip install -q vastai && vastai set api-key "$VAST_API_KEY" > /dev/null
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_PRIVATA_VAST" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "PARTE=$(printf '%02d' ${{ matrix.parte }})" >> $GITHUB_ENV
      - name: Lavoro della scheda, con controlli rigidi
        env:
          CREDITO_INIZIO: ${{ needs.prepara.outputs.credito }}
        run: python3 _06_MaterialeSocial/_04_ProgrammaDiProduzione/_01_LavoroDiUnaScheda.py "$PARTE" "parte_$PARTE.txt" pacco.tgz
      - name: Distruzione di ogni scheda della parte, sempre
        if: always()
        run: |
          for i in $(vastai show instances --raw 2>/dev/null | python3 -c "import json,sys,os; print(' '.join(str(x['id']) for x in json.load(sys.stdin) if str(x.get('label') or '') == 'ms|'+os.environ['GITHUB_RUN_ID']+'|'+os.environ['PARTE']))" 2>/dev/null); do vastai destroy instance $i -y || true; done
      - name: Video per formato ed esito della parte
        if: always()
        run: |
          mkdir -p f/_01_VideoVerticali f/_02_VideoOrizzontali f/_03_VideoFormatoPostInstagram
          for v in uscita/*_verticale_60fps.mp4; do [ -e "$v" ] && cp "$v" f/_01_VideoVerticali/; done
          for v in uscita/*_orizzontale_60fps.mp4; do [ -e "$v" ] && cp "$v" f/_02_VideoOrizzontali/; done
          for v in uscita/*_post_60fps.mp4; do [ -e "$v" ] && cp "$v" f/_03_VideoFormatoPostInstagram/; done
          python3 - <<'PY'
          import json, os, glob
          P = os.environ["PARTE"]; righe = [l.strip().split("|") for l in open(f"parte_{P}.txt") if "|" in l]
          log = "".join(open(f, errors="replace").read() for f in glob.glob("uscita/vast_rendi_*.log"))
          fatti = {os.path.basename(v) for v in glob.glob("uscita/*.mp4")}
          video = {r[0]: ("prodotto" if os.path.basename(r[3]) in fatti else "NOTGO_tremolio" if f"{r[0]}: NOTGO" in log else "non prodotto") for r in righe}
          sch = json.load(open(f"uscita/schede_{P}.json")) if os.path.exists(f"uscita/schede_{P}.json") else {}
          json.dump({"parte": P, "schede": sch.get("schede", []), "registro": sch.get("registro", []), "video": video}, open(f"f/esito_{P}.json", "w"))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "video-parte-${{ matrix.parte }}-${{ github.run_id }}", path: f/, retention-days: 7 }

  chiusura:
    name: Chiusura del giro
    needs: [prepara, parti, render]
    if: always() && needs.prepara.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: arrivi }
      - name: Stato finale, spesa e 0 schede accese
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: |
          pip install -q vastai && vastai set api-key "$VAST_API_KEY" > /dev/null
          for i in $(vastai show instances --raw | python3 -c "import json,sys,os; print(' '.join(str(x['id']) for x in json.load(sys.stdin) if str(x.get('label') or '').startswith('ms|'+os.environ['GITHUB_RUN_ID']+'|')))"); do vastai destroy instance $i -y; done
          sleep 10
          export CREDITO_DOPO=$(vastai show user --raw | python3 -c 'import json,sys; print(json.load(sys.stdin)["credit"])')
          export ACCESE=$(vastai show instances --raw | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          python3 - <<'PY'
          import json, os, glob, subprocess
          src = "arrivi/parti" if os.path.isdir("arrivi/parti") else "arrivi/pacco"
          av = {c: json.load(open(f"{src}/av_{c}.json")) for c in ("Nadia", "Isla")}
          cid = {c: open(f"arrivi/pacco/cid_{c}.txt").read().strip() for c in av}
          esiti = [json.load(open(f)) for f in glob.glob("arrivi/video-parte-*/esito_*.json")]
          for e in esiti:
              for i, s in e["video"].items():
                  c = "Nadia" if i.startswith("fv") else "Isla"; av[c]["video"][i] = s
          spesa = round(float("${{ needs.prepara.outputs.credito }}" or 0) - float(os.environ["CREDITO_DOPO"]), 3)
          for c in av:
              v = av[c]["video"]; n = sum(1 for s in v.values() if s == "prodotto")
              av[c].update(fase="Finito", salvati=n, totale=len(v), spesa=spesa, schede=[{k: e[k] for k in e if k != "video"} for e in esiti], macchine_accese=int(os.environ["ACCESE"]))
              subprocess.run(["gh", "api", "-X", "PATCH", f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs/{cid[c]}", "--input", "-"],
                             input=json.dumps({"status": "completed", "conclusion": "success" if n else "failure", "output": {"title": "Finito", "summary": json.dumps(av[c], ensure_ascii=False)}}).encode(), capture_output=True)
              print(c, n, "prodotti su", len(v))
          print("spesa", spesa, "$, schede accese", os.environ["ACCESE"])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"## Materiale social\nVideo prodotti: Nadia {av['Nadia']['salvati']}, Isla {av['Isla']['salvati']}. Spesa: {spesa} $. Schede accese: {os.environ['ACCESE']}.\n")
          PY
