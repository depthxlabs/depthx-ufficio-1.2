# Il ciclo del Download (Ufficio 1.2 Planimetrie 3D, capo area Mike): parte da solo dopo ogni giro e ogni controllo di Adrian,
# ogni membro della squadra prende i passaggi "da scaricare" della sua fonte, scarica il minimo necessario e lo carica su Drive.
name: Download 00 Ciclo di Mike ogni ora
on:
  # parte da solo appena finisce un giro o un controllo di Adrian: se c'è materiale da scaricare lavora, se no esce subito
  workflow_run:
    workflows: ["Ricerca 00 Ciclo della Ricerca ogni 10 minuti (Adrian)", "Ricerca 00 Adrian controlla ogni ora"]
    types: [completed]
  # riserva, se GitHub salta qualcosa
  schedule:
    - cron: "45 * * * *"
  workflow_dispatch:
concurrency: ciclo-download
jobs:
  scarica:
    name: ${{ matrix.dipendente }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        dipendente: [Kevin, Rosa, Sara, Paul, Noah]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth
      - name: Al lavoro
        env:
          CHIAVE_GOOGLE_SHEET: ${{ secrets.CHIAVE_GOOGLE_SHEET }}
          SEGRETO_DOWNLOAD_DRIVE: ${{ secrets.SEGRETO_DOWNLOAD_DRIVE }}
          INDIRIZZO_DOWNLOAD_DRIVE: ${{ vars.INDIRIZZO_DOWNLOAD_DRIVE }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Rome
        run: python -I "_02_Download/_01_Mike_DirettoreAreaDownload/_01_MotoreDelDownload.py" --dipendente "${{ matrix.dipendente }}" --massimo 40
  riparti:
    name: Mike riparte se resta da scaricare
    needs: scarica
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth
      - id: stato
        env:
          CHIAVE_GOOGLE_SHEET: ${{ secrets.CHIAVE_GOOGLE_SHEET }}
          PYTHONIOENCODING: utf-8
        run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_04_AdrianOrganizzaLaGiornata.py" --fase stato
      - name: Giro successivo del Download, senza sosta
        if: steps.stato.outputs.da_scaricare != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 60
          gh workflow run _02_Download_00_CicloDiMike.yml -R "${{ github.repository }}"
