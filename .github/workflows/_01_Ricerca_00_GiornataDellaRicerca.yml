# La giornata della Ricerca (Ufficio 1.2 Planimetrie 3D): Adrian assegna zone e quote dal foglio "_00_ZoneEQuote",
# i ricercatori lavorano tutti insieme, poi Adrian scrive gli esiti.
# Parte da sola ogni 10 minuti: Adrian dà lavoro a chi è libero, solo se c'è un obiettivo attivo non ancora raggiunto.
# Ogni voce dell'elenco: dipendente|città|provincia|quota|maps|google
name: Ricerca 00 Ciclo della Ricerca ogni 10 minuti (Adrian)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency: giornata-ricerca
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONIOENCODING: utf-8
  TZ: Europe/Rome
permissions:
  contents: read
  checks: write
  actions: write
jobs:
  piano:
    name: Adrian assegna zone e quote
    runs-on: ubuntu-latest
    outputs:
      lavori: ${{ steps.piano.outputs.lavori }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-dati-1.2, ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}", path: dati, sparse-checkout: _01_ListaCRM }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - id: piano
        run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_04_AdrianOrganizzaLaGiornata.py" --fase piano
  lavoro:
    name: ${{ matrix.voce }}
    needs: piano
    if: needs.piano.outputs.lavori != '' && needs.piano.outputs.lavori != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        voce: ${{ fromJSON(needs.piano.outputs.lavori) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-dati-1.2, ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}", path: dati, sparse-checkout: _01_ListaCRM }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - name: Il ricercatore al lavoro
        env:
          VOCE: ${{ matrix.voce }}
          CHIAVE_GOOGLE_MAPS: ${{ secrets.CHIAVE_GOOGLE_MAPS }}
        run: |
          IFS='|' read -r NOME CITTA PROV QUOTA MAPS GOOGLE <<< "$VOCE"
          DIR="_01_Ricerca/_01_Adrian_DirettoreAreaRicerca"
          ESITO=0
          if [ "$MAPS" = "maps" ]; then python -I "$DIR/_01_MotoreDellaRicercaSuMaps.py" --dipendente "$NOME" --citta "$CITTA" --provincia "$PROV" --quota "$QUOTA" || ESITO=1; fi
          # Google classico con il Chrome della macchina di GitHub, senza account
          if [ "$GOOGLE" = "google" ]; then pip install -q playwright && python -I "$DIR/_03_MotoreDellaRicercaSuGoogle.py" --dipendente "$NOME" --citta "$CITTA" --provincia "$PROV" --quota "$QUOTA" || ESITO=1; fi
          exit $ESITO
  chiusura:
    name: Adrian controlla chi ha finito
    needs: [piano, lavoro]
    if: always() && needs.piano.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-dati-1.2, ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}", path: dati, sparse-checkout: _01_ListaCRM }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_04_AdrianOrganizzaLaGiornata.py" --fase controllo
  riparti:
    name: Adrian riparte subito se c'è un obiettivo attivo
    needs: [piano, chiusura]
    if: always() && needs.piano.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: depthxlabs/depthx-dati-1.2, ssh-key: "${{ secrets.CHIAVE_DATI_RICERCA }}", path: dati, sparse-checkout: _01_ListaCRM }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - id: stato
        run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_04_AdrianOrganizzaLaGiornata.py" --fase stato
      - name: Giro successivo della Ricerca, senza sosta
        if: steps.stato.outputs.attivo == 'si'
        env:
          GH_TOKEN: ${{ github.token }}
          LAVORI: ${{ needs.piano.outputs.lavori }}
        run: |
          if [ -z "$LAVORI" ] || [ "$LAVORI" = "[]" ]; then sleep 120; fi
          gh workflow run _01_Ricerca_00_GiornataDellaRicerca.yml -R "${{ github.repository }}"
