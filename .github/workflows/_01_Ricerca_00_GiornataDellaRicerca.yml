# La giornata della Ricerca (Ufficio 1.2 Planimetrie 3D): Adrian assegna zone e quote dal foglio "_00_ZoneEQuote",
# i ricercatori lavorano al massimo 6 alla volta (Google Sheet: 60 richieste al minuto), poi Adrian scrive gli esiti.
# Parte da sola ogni mattina alle 6:00 ora italiana (5:00 UTC d'inverno), oppure a mano da GitHub.
# Ogni voce dell'elenco: dipendente|città|provincia|quota|maps|brave
name: Ricerca 00 Giornata della Ricerca (Adrian)
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
concurrency: giornata-ricerca
env:
  PYTHONIOENCODING: utf-8
  TZ: Europe/Rome
jobs:
  piano:
    name: Adrian assegna zone e quote
    runs-on: ubuntu-latest
    outputs:
      lavori: ${{ steps.piano.outputs.lavori }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth
      - id: piano
        env:
          CHIAVE_GOOGLE_SHEET: ${{ secrets.CHIAVE_GOOGLE_SHEET }}
        run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_04_AdrianOrganizzaLaGiornata.py" --fase piano
  lavoro:
    name: ${{ matrix.voce }}
    needs: piano
    if: needs.piano.outputs.lavori != '' && needs.piano.outputs.lavori != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        voce: ${{ fromJSON(needs.piano.outputs.lavori) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth
      - name: Il ricercatore al lavoro
        env:
          VOCE: ${{ matrix.voce }}
          CHIAVE_GOOGLE_SHEET: ${{ secrets.CHIAVE_GOOGLE_SHEET }}
          CHIAVE_GOOGLE_MAPS: ${{ secrets.CHIAVE_GOOGLE_MAPS }}
          CHIAVE_BRAVE_SEARCH: ${{ secrets.CHIAVE_BRAVE_SEARCH }}
        run: |
          IFS='|' read -r NOME CITTA PROV QUOTA MAPS BRAVE <<< "$VOCE"
          DIR="_01_Ricerca/_01_Adrian_DirettoreAreaRicerca"
          ESITO=0
          if [ "$MAPS" = "maps" ]; then python -I "$DIR/_01_MotoreDellaRicercaSuMaps.py" --dipendente "$NOME" --citta "$CITTA" --provincia "$PROV" --quota "$QUOTA" || ESITO=1; fi
          if [ "$BRAVE" = "brave" ]; then python -I "$DIR/_03_MotoreDellaRicercaSuBrave.py" --dipendente "$NOME" --citta "$CITTA" --provincia "$PROV" --quota "$QUOTA" || ESITO=1; fi
          exit $ESITO
  chiusura:
    name: Adrian scrive gli esiti
    needs: [piano, lavoro]
    if: always() && needs.piano.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth
      - env:
          CHIAVE_GOOGLE_SHEET: ${{ secrets.CHIAVE_GOOGLE_SHEET }}
        run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_04_AdrianOrganizzaLaGiornata.py" --fase chiusura
