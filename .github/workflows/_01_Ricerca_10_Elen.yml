# Elen, Ricerca studi di interni (Ufficio 1.2 Planimetrie 3D, area Ricerca, capo area Adrian)
name: Ricerca 10 Elen studi di interni
on:
  workflow_dispatch:
    inputs:
      citta: { description: "Città da cercare", required: true, default: "Brescia" }
      provincia: { description: "Sigla della provincia", required: true, default: "BS" }
      quota: { description: "Righe da scrivere", required: true, default: "10" }
concurrency: { group: ricerca-elen, cancel-in-progress: false }
jobs:
  ricerca:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests google-auth
      - name: Elen al lavoro
        env:
          CHIAVE_GOOGLE_MAPS: ${{ secrets.CHIAVE_GOOGLE_MAPS }}
          CHIAVE_GOOGLE_SHEET: ${{ secrets.CHIAVE_GOOGLE_SHEET }}
          PYTHONIOENCODING: utf-8
          TZ: Europe/Rome
        run: python -I "_01_Ricerca/_01_Adrian_DirettoreAreaRicerca/_01_MotoreDellaRicercaSuMaps.py" --dipendente Elen --citta "${{ inputs.citta }}" --provincia "${{ inputs.provincia }}" --quota "${{ inputs.quota }}"
